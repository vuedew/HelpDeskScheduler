<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Staff Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="left">
        <div class="brand-wrap">
          <img src="./umn-logo.png" class="brand-logo">
          <div class="brand">
            <div class="brand-title">Help Desk Scheduler</div>
            <div class="brand-subtitle">UMN Crookston</div>
          </div>
        </div>

        <a data-nav href="staff-dashboard.html">Dashboard</a>
        <a data-nav href="staff-requests.html">Requests</a>
      </div>

      <div class="right">
        <span class="chip">User: <b id="userName"></b></span>
        <span class="chip">Role: <b id="roleName"></b></span>
        <button class="btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="card">
      <h1>My Schedule</h1>

      <div class="row" style="margin-bottom:12px;">
        <label for="datePicker" style="margin:0;">Select Date</label>
        <input id="datePicker" type="date" style="max-width:180px;">
      </div>

      <div class="row">
        <span class="chip">Week: <b id="weekStart"></b></span>
        <span class="chip">Status: <b id="schedStatus"></b></span>
        <span class="chip">My Shifts: <b id="myShiftCount"></b></span>
      </div>

      <table class="table" id="shiftTable" style="margin-top:12px;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Start</th>
            <th>End</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./app.js"></script>
  <script src="./api.js"></script>
  <script src="./staff-dashboard.integration.js"></script>
</body>
</html>
