<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard | Help Desk Scheduler</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="left">
        <div class="brand-wrap">
          <img src="./umn-logo.png" alt="UMN Crookston" class="brand-logo">
          <div class="brand">
            <div class="brand-title">Help Desk Scheduler</div>
            <div class="brand-subtitle">UMN Crookston</div>
          </div>
        </div>

        <a data-nav href="admin-dashboard.html">Overview</a>
        <a data-nav href="admin-schedule.html">Schedule</a>
        <a data-nav href="admin-approvals.html">Approvals</a>
      </div>

      <div class="right">
        <span class="chip">User: <b id="userName"></b></span>
        <span class="chip">Role: <b id="roleName"></b></span>
        <button class="btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="card">
      <h1>Admin Overview</h1>

      <div class="row">
        <span class="chip">Pending: <b id="pendingCount"></b></span>
        <span class="chip">Total Shifts: <b id="totalShiftCount"></b></span>
        <span class="chip">Status: <b id="adminSchedStatus"></b></span>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./api.js"></script>
  <script src="./admin-dashboard.integration.js"></script>
</body>
</html>
